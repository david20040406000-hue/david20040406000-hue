<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Zhaxia — Code. Adapt. Evolve.</title>
<desc id="desc">Zhaxia 的個人首頁。自主決策與演算法；作品：Screeps Empire AI。數學興趣圓環：偏微分方程 9%、微分幾何 20%、抽象代數 13%、拓樸學 25%、實分析 12%、泛函分析 21%。比例為隨機視覺配置。</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#007759"/><stop offset="1" stop-color="#205da8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#007759" stop-opacity=".13"/><stop offset="1" stop-color="#007759" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce9e7" stroke-width=".6"/></pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="648" rx="20"/></clipPath>
  <clipPath id="typing"><rect class="type-reveal" x="0" y="-22" width="380" height="30"/></clipPath>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:#122d31;}
  .mono {font-family: 'SF Mono', Menlo, Consolas, monospace; font-size:14px;}
  .label {font-family: 'SF Mono', Menlo, Consolas, monospace; font-size:11px; letter-spacing:2px; fill:#526b74;}
  .muted {fill:#526b74;} .green {fill:#007759;} .blue {fill:#205da8;}
  .reveal {animation:appear .65s both;} .row1 {animation-delay:.55s;} .row2 {animation-delay:.8s;} .row3 {animation-delay:1.05s;} .row4 {animation-delay:1.3s;} .row5 {animation-delay:1.55s;}
  .type-reveal {animation:typing 1.25s steps(28,end) both;}
  .interest-sweep {animation:revealInterest 2.6s cubic-bezier(.4,0,.2,1) .15s both;}
  .interest-label {animation:appear .6s 1.9s both;}
  .flow {stroke-dasharray:38 520;animation:flow 7s linear infinite;}
  .cursor {animation:blink 1.4s step-end infinite;}
  @keyframes appear {from {opacity:0;transform:translateY(5px);} to {opacity:1;transform:translateY(0);}}
  @keyframes typing {from {width:0;} to {width:380px;}}
  @keyframes revealInterest {from {stroke-dashoffset:var(--circ);} to {stroke-dashoffset:0;}}
  @keyframes flow {to {stroke-dashoffset:-558;}}
  @keyframes blink {0%,60% {opacity:1;} 61%,100% {opacity:0;}}
  @media (prefers-reduced-motion: reduce) { .reveal,.type-reveal,.interest-sweep,.interest-label,.flow,.cursor {animation:none !important;} }
</style>
